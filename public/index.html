<!doctype html>
<html lang="zh-CN" data-api-base="{{WB_API_BASE}}" data-runtime="{{WB_RUNTIME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>小泉宝 UroPal · 膀胱癌工作台 v{{WB_VERSION}}</title>
<meta name="description" content="膀胱癌患者与照护者的资料整理工作台。数据只在本机，不上传；记录不是诊断，判读归泌尿外科与治疗团队。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2048%2048'%3E%3Ccircle%20cx='24'%20cy='24'%20r='19'%20fill='%23E7F4F7'/%3E%3Cpath%20d='M24%2010c5%206%209%2010.5%209%2015a9%209%200%200%201-18%200c0-4.5%204-9%209-15Z'%20fill='%231793A6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="primer.css">
</head>
<body>

<!-- ============ customFrame 顶栏（三段式）============ -->
<header class="wb-topbar wb-shell-topbar" role="banner">
  <!-- 左：品牌 + 版本 chip（版本号首屏可见 = 发布可见性 P1） -->
  <div class="tb-brand">
    <span class="tb-mark" aria-hidden="true"></span>
    <span class="tb-name">小泉宝 UroPal</span>
    <span class="tb-version" id="versionChip" title="版本号由构建从 VERSION 文件注入，与 package.json 同源">v{{WB_VERSION}}</span>
  </div>

  <!-- 中：一句状态说明（随页面变化） -->
  <p class="tb-status" id="tbStatus">数据只在本机 · 记录不是诊断</p>

  <!-- 右：状态灯 + 主操作按钮组（紧贴右缘） -->
  <div class="tb-actions">
    <span class="tb-pill" id="pillDir" data-state="off"><i aria-hidden="true"></i>资料目录 未接入</span>
    <span class="tb-pill" id="pillTalk" data-state="off"><i aria-hidden="true"></i>对话 未接入</span>
    <button type="button" class="tb-btn tb-btn-ghost" data-primer-open aria-haspopup="dialog" aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
    <button type="button" class="tb-btn tb-btn-ghost" id="btnTextSize" aria-pressed="false" title="切换大字模式（正文字号升一档）">大字 <span class="tbig">Aa</span></button>
    <button type="button" class="tb-btn tb-btn-ghost" id="btnWording" title="文案红线自检（本页扫描）">文案自检</button>
  </div>
</header>

<div class="wb-body">

  <!-- ============ 左侧导航（品牌块 + 演示档案 + 分组导航，由 app.js 渲染）============ -->
  <nav class="wb-nav" id="wbNav" aria-label="主导航"></nav>

  <!-- ============ 业务主区 ============ -->
  <main class="wb-main" id="wbMain" tabindex="-1">
    <div class="wb-crumb" id="wbCrumb"><!-- 面包屑，由 app.js 渲染 --></div>
    <div class="wb-page" id="wbPage"><!-- 由 app.js 渲染 --></div>
    <footer class="wb-footer">
      <span>小泉宝 UroPal · 开发版 · 版本 <b id="footVersion">{{WB_VERSION}}</b></span>
      <span class="wb-foot-note">数据只在本机；<b>记录不是诊断，不构成治疗建议</b></span>
    </footer>
  </main>

</div>

<div class="wb-toast" id="wbToast" role="status" aria-live="polite" hidden></div>

<script>window.__WB_INFO__ = {{WB_INFO}};</script>
<script src="primer-data.js"></script>
<script src="primer.js"></script>
<script src="app.js"></script>
</body>
</html>
